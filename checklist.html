<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1f33">
<title>가족 사용 점검표 · 딸깍공방</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <p><a href="./" style="color:inherit">← 딸깍공방</a></p>
    <h1>가족 사용 점검표</h1>
    <p>한 사람이 한 앱을 써 본 뒤 하나씩 채워요. 아는 것만 골라도 괜찮아요. 적은 내용은 이 기기에만 남아요.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="앱 고르기">
    <button class="btn" role="tab" id="tab-baduk" aria-controls="form-baduk" aria-selected="true">바둑 첫걸음</button>
    <button class="btn" role="tab" id="tab-art" aria-controls="form-art" aria-selected="false">명화 산책</button>
    <button class="btn" role="tab" id="tab-guitar" aria-controls="form-guitar" aria-selected="false">여섯줄</button>
  </div>

  <form class="panel" id="who" autocomplete="off">
    <div class="q">
      <label for="nick">써 본 사람 별명 <small>실명 말고 별명이면 충분해요</small></label>
      <input type="text" id="nick" name="nick" maxlength="20" placeholder="예: 첫째">
    </div>
    <fieldset class="q">
      <legend>학년대</legend>
      <div class="choices">
        <label><input type="radio" name="grade" value="초등 저학년"> 초등 저학년</label>
        <label><input type="radio" name="grade" value="초등 중학년"> 초등 중학년</label>
        <label><input type="radio" name="grade" value="초등 고학년"> 초등 고학년</label>
        <label><input type="radio" name="grade" value="중학생"> 중학생</label>
        <label><input type="radio" name="grade" value="어른"> 어른</label>
      </div>
    </fieldset>
    <fieldset class="q">
      <legend>쓴 기기</legend>
      <div class="choices">
        <label><input type="radio" name="device" value="휴대폰"> 휴대폰</label>
        <label><input type="radio" name="device" value="태블릿"> 태블릿</label>
        <label><input type="radio" name="device" value="PC"> PC</label>
      </div>
    </fieldset>
  </form>

  <form class="panel" id="form-baduk" role="tabpanel" aria-labelledby="tab-baduk" autocomplete="off"></form>
  <form class="panel" id="form-art" role="tabpanel" aria-labelledby="tab-art" autocomplete="off" hidden></form>
  <form class="panel" id="form-guitar" role="tabpanel" aria-labelledby="tab-guitar" autocomplete="off" hidden></form>

  <section class="panel">
    <h2>보내기</h2>
    <p>[결과 복사]를 누른 뒤 메신저나 대화창에 붙여 넣어 주세요.</p>
    <div class="row">
      <button class="btn primary" type="button" id="copy">결과 복사</button>
      <button class="btn" type="button" id="reset">이 앱 점검표 비우기</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <textarea id="out" readonly aria-label="복사할 결과" hidden></textarea>
  </section>
</main>
<script src="checklist.js"></script>
</body>
</html>
